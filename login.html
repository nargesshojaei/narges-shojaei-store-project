<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Shoea – Sign In</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#C50A0A',
            dark: '#1A1A1A',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>

<body class="font-sans bg-gray-100 flex items-center justify-center min-h-screen">

  <div class="w-[390px] h-[844px] relative overflow-hidden shadow-2xl rounded-[40px] bg-white flex flex-col">

    <!-- Back -->
    <div class="px-6 pt-12 flex-shrink-0">
      <button onclick="history.back()"
        class="w-8 h-8 rounded-full border border-gray-200 flex items-center justify-center">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1A1A1A" stroke-width="2.5"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6" />
        </svg>
      </button>
    </div>

    <!-- Logo -->
    <div class="flex justify-center pt-6 pb-6 flex-shrink-0">
      <div class="w-16 h-16 rounded-full flex items-center justify-center mb-28">
        <svg xmlns="http://www.w3.org/2000/svg" width="54" height="81" viewBox="0 0 54 81" fill="none">
          <path
            d="M9.23355 17.7415C22.2531 10.4389 33.6453 3.542 39.7482 0.499261C44.834 -2.54348 47.1042 9.00132 42.7997 16.7273C38.4952 24.4532 26.5252 28.8982 26.5252 28.8982C26.5252 28.8982 52.9712 22.8128 53.9884 46.1404C54.2537 52.2259 49.9198 59.3256 46.8683 61.3541C43.8168 63.3826 17.3708 79.1034 14.3194 80.6248C10.7425 82.4081 9.23359 77.582 9.23359 71.4965C9.23359 57.2971 25.5081 52.2259 25.5081 52.2259C11.2679 54.2544 2.1135 49.1832 0.0791923 33.9695C-0.598903 28.8982 3.13068 21.1646 9.23355 17.7415Z"
            fill="black" />
        </svg>
      </div>
    </div>

    <!-- Scrollable -->
    <div class="flex-1 overflow-y-auto px-8 pb-10">

      <h1 class="text-dark text-[30px] font-bold leading-snug mb-8">
        Login to Your Account
      </h1>

      <!-- Error -->
      <div id="error-msg"
        class="hidden mb-4 px-4 py-2 bg-red-50 border border-red-200 text-red-600 text-xs rounded-lg">
      </div>

      <!-- Email field -->
      <div class="flex items-center border-b border-gray-200 py-[10px] gap-2 mb-2 bg-[#f9f9f9]">
        <span class="text-gray-300 flex items-center flex-shrink-0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
            <polyline points="22,6 12,13 2,6" />
          </svg>
        </span>
        <input id="email" type="email" placeholder="Email" autocomplete="email"
          class="flex-1 border-none outline-none text-[13px] text-dark bg-transparent placeholder-gray-300" />
      </div>

      <!-- Password field -->
      <div id="pass-row"
        class="flex items-center border-b border-gray-200 py-[10px] gap-2 mb-2 bg-[#f9f9f9]">
        <span class="text-gray-300 flex items-center flex-shrink-0">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
            <path d="M7 11V7a5 5 0 0 1 10 0v4" />
          </svg>
        </span>
        <input id="password" type="password" placeholder="Password" autocomplete="current-password"
          class="flex-1 border-none outline-none text-[13px] text-dark bg-transparent placeholder-gray-300" />
        <button class="bg-transparent border-none cursor-pointer text-gray-300 flex items-center p-0"
          onclick="togglePassword()" type="button" id="eye-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
      </div>

      <!-- Remember me -->
      <label class="flex items-center gap-2 mt-5 cursor-pointer select-none w-fit m-auto">
        <div class="relative w-4 h-4">
          <input type="checkbox" id="remember"
            class="peer w-4 h-4 rounded border border-gray-300 checked:bg-dark checked:border-dark cursor-pointer appearance-none" />
          <svg class="absolute inset-0 w-4 h-4 hidden peer-checked:block pointer-events-none" viewBox="0 0 16 16"
            fill="none">
            <rect width="16" height="16" rx="3" fill="#1A1A1A" />
            <polyline points="3,8 6.5,11.5 13,5" stroke="white" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <span class="text-xs text-gray-500">Remember me</span>
      </label>

      <!-- Sign In -->
      <button onclick="handleSignIn()"
        class="mt-10 w-full bg-dark text-white py-[14px] rounded-full font-semibold text-sm active:scale-95 transition-transform">
        Sign In
      </button>

    </div>
  </div>

  <script src="/asert/script/login.js"></script>

</body>
</html>
